<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Frota | Lameiras Mendes</title>
    <link rel="stylesheet" href="projecto.css">
</head>

<body>

<header>
    <img src="imagens/logo.jpg" id="logo" alt="Logótipo Lameiras Mendes">

    <h1 id="titulo">
        Lameiras Mendes<br>
        <span class="transportes">Transportes</span>
    </h1>

    <p class="destaque">Área Reservada</p>
</header>

<section class="caixa">

    <div class="botoes-topo-gestao">
        <button onclick="voltarMenuPrincipal()">🏠 Menu Principal</button>
        <button onclick="terminarSessao()">🚪 Terminar Sessão</button>
    </div>

    <h2>Gestão de Frota</h2>

    <div id="estatisticas-frota"></div>

    <div class="pesquisa-frota">
        <input
            type="text"
            id="pesquisa-matricula"
            placeholder="Pesquisar por matrícula..."
        >

        <button onclick="pesquisarMatricula()">Pesquisar</button>
    </div>

    <div id="lista-frota"></div>

</section>

<footer>
    <p>© Lameiras Mendes Transportes</p>
</footer>

<script src="app.js"></script>

<script>
function terminarSessao() {
    window.location.href = "login.html";
}

function voltarMenuPrincipal() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
