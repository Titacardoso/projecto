<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatura | Lameiras Mendes Transportes</title>
    <link rel="stylesheet" href="projecto.css">
</head>

<body>

<header>
    <img src="logo.png" id="logo" alt="Logótipo Lameiras Mendes">

    <h1 id="titulo">Lameiras Mendes Transportes</h1>

    <p class="destaque">Qualidade que move o seu negócio.</p>

    <nav>
        <a href="index.html">Início</a>
        <a href="frota.html">A nossa frota</a>
        <a href="contactos.html">Contacte-nos</a>
        <a href="candidatura.html">Candidatura</a>
    </nav>
</header>

<section class="caixa">
    <h2>Candidatura</h2>

    <p>Preencha o formulário abaixo para se candidatar a uma oportunidade na nossa empresa.</p>

    <form>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone">

        <label for="morada">Morada:</label>
        <input type="text" id="morada" name="morada">

        <label for="funcao">Função a que se candidata:</label>
        <input type="text" id="funcao" name="funcao">

        <label for="mensagem">Apresentação:</label>
        <textarea id="mensagem" name="mensagem" rows="6"></textarea>

        <input type="submit" value="Enviar candidatura">

    </form>
</section>

</body>
</html>
